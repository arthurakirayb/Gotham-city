{% extends 'base.html' %}

{% block title %}Novo comentário{% endblock %}

{% block body_class %}has-overlay{% endblock %}

{% block content %}
<h2>Comentar em "{{ post.titulo }}"</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Comentar</button>
  <a href="{% url 'detalhe' post.pk %}">Cancelar</a>
</form>
{% endblock %}
